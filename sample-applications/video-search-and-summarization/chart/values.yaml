global:
  # Set this value to hostPath where we want to mount a volume (Used in single node cluster or standalone sub-chart installation).
  volumeHostPath: "/mnt/vss-data"

  # usePvc should be set to true to use a new PVC for storage required by any of the subchart.
  usePvc: false

  # keepPvc should be set to true to retain the PVC after uninstalling the chart.
  keepPvc: false

  # sharedPvcName is the PVC shared by VDMS Dataprep and Multimodel-Embedding-MS subcharts.
  sharedPvcName: "vss-shared-pvc"

  # huggingfaceToken should be set during installation if gated models need to be accessed.
  huggingfaceToken: ""

  # vdmsIndexName is the DB Index or DB Collection name used by VDMS Vector DB.
  vdmsIndexName: ""

  # vlmName is Vision-Language Model Name used by VLM Inference Microservice
  vlmName: ""
  # llmName is Large Language Model Name used by OVMS service
  llmName: ""

  gpu:
    vlminferenceEnabled: false
    multimodalembeddingmsEnabled: false
    vdmsdataprepEnabled: false
    ovmsEnabled: false

    key:
    device:
    group_add: $(stat -c "%g" /dev/dri/render*)

  proxy:
    no_proxy: "localhost,127.0.0.1,192.168.0.0/16,172.16.0.0/12,127.0.0.0/8,10.0.0.0/8,.svc.cluster.local"
    http_proxy: ""
    https_proxy: ""
  env:
    POSTGRES_DB: video_summary_db
    POSTGRES_USER: ""
    POSTGRES_PASSWORD: ""
    MINIO_ROOT_USER: ""
    MINIO_ROOT_PASSWORD: ""
    RABBITMQ_DEFAULT_USER: ""
    RABBITMQ_DEFAULT_PASS: ""
    OTLP_ENDPOINT: ""
    OTLP_ENDPOINT_TRACE: ""
    DEFAULT_BUCKET_NAME: "video-summary"
    MULTIMODAL_EMBEDDING_ENDPOINT: "http://multimodal-embedding-ms:8000/embeddings"
    EMBEDDING_MODEL_NAME: ""
    TEXT_EMBEDDING_MODEL_NAME: ""
    EMBEDDING_PROCESSING_MODE: "sdk"
    SDK_USE_OPENVINO: true
    VDMS_DATAPREP_DEVICE: "CPU"
    DEVICE: "CPU"
    OV_MODELS_DIR: "/app/ov_models"
    OV_PERFORMANCE_MODE: "THROUGHPUT"
    VDMS_DATAPREP_LOG_LEVEL: "INFO"
    keeppvc: false # Set to true to keep PVCs after uninstalling the chart
  embedding:
    preferTextModel: false

# sharedClaimSize is the storage size claimed by shared PVC used by VDMS Dataprep and Multimodal-Embedding-MS subcharts.
sharedClaimSize: "7Gi"

rabbitmq:
  enabled: false
  name: rabbitmq
  fullname: rabbitmq
  service:
    name: rabbitmq
    type: ClusterIP
    amqpPort: 5672
    managementPort: 15672
    mqttPort: 1883
  # Resource overrides for rabbitmq subchart
  rabbitmq:
    resources:
      requests:
        cpu: "0.5"
        memory: "1Gi"
      limits:
        cpu: "1"
        memory: "2Gi"

minioserver:
  claimSize: "5Gi"
  service:
    apiPort: 9000
  # Resource overrides for minio-server subchart
  resources:
    requests:
      cpu: "0.5"
      memory: "1Gi"
    limits:
      cpu: "1"
      memory: "2Gi"

videoSummaryManager:
  name: videosummarybackend
  image:
    # repository: intel/pipeline-manager
    # tag: "1.3.1"
    repository: pvelab/pipeline-manager
    tag: vllm-support-remove-debug-logs
    pullPolicy: IfNotPresent
  containerPortName: videosumm-port # Optional name to refer containerPort
  service:
    type: ClusterIP
    port: 80 # Port on which service listens for incoming connection, if exposed externally
  resources:
    requests:
      cpu: "2"
      memory: "4Gi"
    limits:
      cpu: "4"
      memory: "8Gi"
  minioProtocol: "http:"
  minioBucket: "video-search-summary"
  env:
    LLM_SUMMARIZATION_KEY: ""
    LLM_SUMMARIZATION_DEVICE: "CPU"
    VLM_CAPTIONING_KEY: ""
    VLM_CAPTIONING_DEVICE: "CPU"
    LLM_CONCURRENT: "4" # 2 -> 4
    VLM_CONCURRENT: "6" # 4 -> 6
    SUMMARIZATION_MAX_COMPLETION_TOKENS: "4000"
    CAPTIONING_MAX_COMPLETION_TOKENS: "1024"
    MAX_CONTEXT_LENGTH: "90000"
    LLM_MODEL_API: "v1/config"
    MULTI_FRAME_COUNT: "12"
    AUDIO_DEVICE: "cpu"
    OTLP_TRACE_URL: ""
    USE_OVMS: "CONFIG_OFF"
    SUMMARY_FEATURE: "FEATURE_ON"
    SEARCH_FEATURE: "FEATURE_OFF"
  nodeSelector: {}
  affinity: {}
  tolerations: []

audioanalyzer:
  enabled: false
  name: audioanalyzer
  claimSize: "3Gi"
  service:
    port: 8000
    targetPort: 8000
    type: ClusterIP
  # Resource overrides for audio-analyzer subchart
  audioanalyzer:
    resources:
      requests:
        cpu: "4"
        memory: "4Gi"
      limits:
        cpu: "6"
        memory: "8Gi"

videoingestion:
  enabled: false
  name: videoingestion
  fullnameOverride: videoingestion
  fullname: videoingestion
  claimSize: "2Gi"
  # odModelName defines the name of Object Detection Model
  odModelName: ""
  # odModelType defines the type of Object Detection Model. e.g., "yolo_v8"
  odModelType: ""
  service:
    type: ClusterIP
    port: 8080
  # Resource overrides for video-ingestion subchart
  videoingestion:
    resources:
      requests:
        cpu: "6"
        memory: "6Gi"
      limits:
        cpu: "10"
        memory: "10Gi"

ovms:
  name: ovms
  enabled: false
  claimSize: "6Gi"
  service:
    port: 8300

vlminference:
  enabled: false
  name: vlm-inference-microservice
  claimSize: "40Gi"

# Add nginx configuration
nginx:
  name: video-summary-nginx
  containerPortName: nginx-port
  service:
    type: NodePort
    port: 80
  affinity:
    nodeAffinity:
      requiredDuringSchedulingIgnoredDuringExecution:
        nodeSelectorTerms:
          - matchExpressions:
              - key: kubernetes.io/ready
                operator: In
                values:
                  - "true"

postgresql:
  name: postgresql
  fullname: postgresql
  claimSize: "5Gi"
  service:
    type: ClusterIP
    port: 5432
  # Resource overrides for postgresql subchart
  postgresql:
    resources:
      requests:
        cpu: "1"
        memory: "8Gi"
      limits:
        cpu: "2"
        memory: "12Gi"

# Placeholder for multimodal-embedding-ms subchart
multimodalembeddingms:
  enabled: false
  name: multimodal-embedding-ms
  service:
    type: ClusterIP
    port: 8000
  modelPvc:
    enabled: true
    size: "10Gi"
  # Resource overrides for multimodal-embedding-ms subchart
  resources:
    requests:
      cpu: "4"
      memory: "6Gi"
    limits:
      cpu: "8"
      memory: "10Gi"

# Placeholder for vdms-dataprep subchart
vdmsdataprep:
  enabled: false
  name: vdms-dataprep
  service:
    type: ClusterIP
    port: 8000
  modelPvc:
    enabled: true
    size: "10Gi"
  # Resource overrides for vdms-dataprep subchart
  resources:
    requests:
      cpu: "2"
      memory: "6Gi"
    limits:
      cpu: "4"
      memory: "10Gi"
  # Startup probe: failureThreshold controls max wait time (initialDelay + period * failureThreshold)
  # Default 310s (10 + 30×10) to allow OpenVINO model conversion on first boot
  startupProbe:
    httpGet:
      path: /health
      port: dataprep-port
    initialDelaySeconds: 10
    periodSeconds: 10
    failureThreshold: 30

# Placeholder for vdms-vectordb subchart
vdmsvectordb:
  enabled: false
  name: vdms-vectordb
  claimSize: "8Gi"
  service:
    type: ClusterIP
    port: 55555
  # Resource overrides for vdms-vectordb subchart
  resources:
    requests:
      cpu: "4"
      memory: "32Gi"
    limits:
      cpu: "6"
      memory: "48Gi"

# Placeholder for videosearch subchart
videosearch:
  enabled: false
  name: videosearch
  service:
    type: ClusterIP
    port: 8000
  # Resource overrides for video-search subchart
  videosearch:
    resources:
      requests:
        cpu: "1"
        memory: "2Gi"
      limits:
        cpu: "2"
        memory: "4Gi"

# Resource overrides for video-summary-ui subchart
videosummaryui:
  image:
    resources:
      requests:
        cpu: 250m
        memory: 512Mi
      limits:
        cpu: 500m
        memory: 1Gi
